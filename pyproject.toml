[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "subtrace"
version = "10.0.0"
description = "Lightweight DNS and HTTP reconnaissance tool"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "dnspython",
    "requests"
]

[project.scripts]
subtrace = "subtrace:main"

[tool.setuptools]
py-modules = ["subtrace"]